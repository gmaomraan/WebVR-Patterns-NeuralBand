<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="description" content="Vision test pattern viewer for Meta Ray-Ban Display, navigable with Neural Band gestures">
    <meta name="mrbd-web-app-capable" content="yes">
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
    <title>Pattern Viewer</title>
    <style>
        /*
            Fixed 600x600 viewport, no scrolling, dark background with
            bright/light UI — per Meta Ray-Ban Display Web App guidance.
            The display is an additive waveguide: pure black is fully
            transparent, so dark chrome effectively disappears and bright
            colors are what's actually visible to the wearer.
        */
        html, body {
            margin: 0;
            padding: 0;
            width: 600px;
            height: 600px;
            overflow: hidden;
            background: #000;
            color: #eee;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        #listView, #displayView {
            width: 600px;
            height: 600px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        /* — List view — */
        #listView {
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        #listTitle {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin: 0 0 12px 4px;
        }

        #patternList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* — Shared focusable style — */
        .focusable {
            font-size: 18px;
            color: #eee;
            background: #151515;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 0 16px;
            text-align: left;
            cursor: pointer;
            transition: all 120ms ease;
        }

        .pattern-item {
            min-height: 64px;
            display: flex;
            align-items: center;
        }

        .focusable:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.5);
            background: #1c1c1c;
        }

        .swatch {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            margin-right: 14px;
            border: 1px solid #444;
            flex-shrink: 0;
        }

        /* — Display view — */
        #displayView {
            position: relative;
        }

        #patternCanvas {
            width: 600px;
            height: 600px;
        }

        /* Pattern renders */
        .pattern-white   { background: #fff; }
        .pattern-red      { background: #ff2020; }
        .pattern-green    { background: #20ff20; }
        .pattern-blue     { background: #2060ff; }
        .pattern-black    { background: #000; }
        .pattern-grille {
            background: repeating-linear-gradient(to right, #fff 0px 20px, #000 20px 40px);
        }
        .pattern-crosshair {
            background: #000;
            position: relative;
        }
        .pattern-crosshair::before,
        .pattern-crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        .pattern-crosshair::before {
            /* horizontal bar */
            left: 0; right: 0; top: 50%;
            height: 6px;
            transform: translateY(-50%);
        }
        .pattern-crosshair::after {
            /* vertical bar */
            top: 0; bottom: 0; left: 50%;
            width: 6px;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div id="listView">
        <div id="listTitle">Pattern Viewer</div>
        <div id="patternList"></div>
    </div>

    <div id="displayView" class="hidden">
        <div id="patternCanvas"></div>
    </div>

    <script>
        // Same 7 default patterns as the Custom Pattern Creator's default package.
        var PATTERNS = [
            { id: 'white',     name: 'White',     swatch: '#fff' },
            { id: 'red',       name: 'Red',       swatch: '#ff2020' },
            { id: 'green',     name: 'Green',     swatch: '#20ff20' },
            { id: 'blue',      name: 'Blue',      swatch: '#2060ff' },
            { id: 'black',     name: 'Black',     swatch: '#000' },
            { id: 'grille',    name: 'Grille',    swatch: 'repeating-linear-gradient(to right, #fff 0 4px, #000 4px 8px)' },
            { id: 'crosshair', name: 'Crosshair', swatch: '#000' },
        ];

        var listViewEl = document.getElementById('listView');
        var displayViewEl = document.getElementById('displayView');
        var patternListEl = document.getElementById('patternList');
        var patternCanvasEl = document.getElementById('patternCanvas');

        // 'list' | 'display' — governs how keydown is interpreted below.
        var currentView = 'list';
        var currentPatternIndex = -1;

        // Build the pattern list as focusable buttons.
        PATTERNS.forEach(function (pattern) {
            var item = document.createElement('button');
            item.className = 'focusable pattern-item';
            item.dataset.patternId = pattern.id;

            var swatch = document.createElement('span');
            swatch.className = 'swatch';
            swatch.style.background = pattern.swatch;
            item.appendChild(swatch);

            var label = document.createElement('span');
            label.textContent = pattern.name;
            item.appendChild(label);

            item.addEventListener('click', function () {
                showDisplayView(pattern.id);
            });

            patternListEl.appendChild(item);
        });

        function showListView() {
            currentView = 'list';
            displayViewEl.classList.add('hidden');
            listViewEl.classList.remove('hidden');
            var first = patternListEl.querySelector('.focusable');
            if (first) first.focus();
        }

        function showDisplayView(patternId) {
            currentView = 'display';
            currentPatternIndex = PATTERNS.findIndex(function (p) { return p.id === patternId; });
            patternCanvasEl.className = 'pattern-' + patternId;
            listViewEl.classList.add('hidden');
            displayViewEl.classList.remove('hidden');
            // No focusable elements in this view at all — the pattern
            // renders with zero visible UI. Any direction press (handled
            // below) returns to the list.
            document.activeElement.blur();
        }

        function showNextPattern() {
            var nextIndex = (currentPatternIndex + 1) % PATTERNS.length;
            showDisplayView(PATTERNS[nextIndex].id);
        }

        // — D-pad input, per Meta's Web App build guide —
        var DPAD = {
            UP: 'ArrowUp', DOWN: 'ArrowDown',
            LEFT: 'ArrowLeft', RIGHT: 'ArrowRight',
            SELECT: 'Enter',
        };

        function moveFocus(direction) {
            var focusables = Array.from(
                document.querySelectorAll('.focusable:not([disabled]):not(.hidden)')
            ).filter(function (el) { return el.offsetParent !== null; });
            if (!focusables.length) return;

            var idx = focusables.indexOf(document.activeElement);
            if (idx === -1) { focusables[0].focus(); return; }

            var next = (direction === 'up' || direction === 'left')
                ? (idx > 0 ? idx - 1 : focusables.length - 1)
                : (idx < focusables.length - 1 ? idx + 1 : 0);

            focusables[next].focus();
            focusables[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        document.addEventListener('keydown', function (e) {
            // "Back navigation" isn't part of the Neural Band's confirmed
            // gesture vocabulary (only the four arrow directions + Enter
            // are documented as supported) — so instead of a dedicated
            // back gesture, any direction press while viewing a pattern
            // full-screen (nothing else to navigate to there) returns to
            // the list. This is what replaces the removed Back button.
            if (currentView === 'display') {
                switch (e.key) {
                    case DPAD.UP: case DPAD.DOWN: case DPAD.LEFT: case DPAD.RIGHT:
                        showListView();
                        e.preventDefault();
                        break;
                    case DPAD.SELECT:
                        // Index pinch/tap: cycle to the next pattern without
                        // leaving the full-screen display view.
                        showNextPattern();
                        e.preventDefault();
                        break;
                }
                return;
            }

            switch (e.key) {
                case DPAD.UP:     moveFocus('up');    break;
                case DPAD.DOWN:   moveFocus('down');  break;
                case DPAD.LEFT:   moveFocus('left');  break;
                case DPAD.RIGHT:  moveFocus('right'); break;
                case DPAD.SELECT:
                    if (document.activeElement.classList.contains('focusable')) {
                        document.activeElement.click();
                    }
                    break;
                default: return; // don't preventDefault on unhandled keys
            }
            e.preventDefault();
        });
    </script>
</body>
</html>
